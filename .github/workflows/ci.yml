whename: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Build, Unit Tests & Architecture Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend & Run Unit Tests
        run: |
          ./mvnw -f backend/pom.xml --batch-mode --no-transfer-progress clean verify

      - name: Architecture checks
        run: |
          ./mvnw -f backend/pom.xml test -Dtest=ArchitectureRulesTest

  frontend-checks:
    name: Frontend Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Build Frontend
        run: |
          npm run build --prefix frontend

  secret-scan:
    name: High-Confidence Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Scan tracked files
        shell: bash
        run: |
          ! git grep -nEI \
            'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' \
            -- ':!*.lock'

  docs-checks:
    name: Documentation Compliance (CR-01 Lettuce Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: Check for Forbidden Redis Client Name in Contracts
        run: |
          echo "Verifying that 'Lettuce' does not appear in architecture.md or deployment.md..."
          if grep -i "lettuce" docs/architecture.md docs/deployment.md; then
            echo "ERROR: CR-01 violation detected! The word 'Lettuce' must not appear in architecture.md or deployment.md."
            exit 1
          fi
          echo "Lettuce check passed: 0 occurrences found."
