# ==============================================================================
# VENUE NEXUS - Gitleaks Secret Scanning Configuration
# Justification: TRD Section 15.7 mandates explicit secret scanning rules
# covering payment gateway credentials, webhook secrets, and AI provider API keys
# to ensure no sensitive credentials leak into git history.
# ==============================================================================

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for documentation examples and template variables"
paths = [
  '''^\.env\.example$''',
  '''^docs/.*''',
  '''^README\.md$''',
  '''^backend/src/test/resources/application-test\.yml$'''
]
regexes = [
  '''replace_with_.*''',
  '''placeholder_.*''',
  '''dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItdmVudWUtbmV4dXMtYXVkaXQtYW5kLXNlY3VyaXR5LXRlc3RzCg==''',
  '''dGhpcy1pcy1hLXRlbXBvcmFyeS1kZXYtc2VjcmV0LWtleS1mb3ItdmVudWUtbmV4dXMtcGxhdGZvcm0='''
]

# Rule 1: Payment Provider Credentials (TRD 15.7, CR-02)
[[rules]]
id = "venue-nexus-payment-secret"
description = "Detected potential Payment Gateway API key or secret token"
regex = '''(?i)(payment[_-]?provider|stripe|razorpay|adyen|square)[_-]?(key|secret|token|api[_-]?key)\s*[:=]\s*['"][0-9a-zA-Z_\-]{16,}['"]'''
secretGroup = 0
keywords = [
  "payment_provider",
  "payment-provider",
  "stripe",
  "razorpay",
  "adyen"
]

# Rule 2: Payment Webhook Secret (TRD 15.7, CR-02)
[[rules]]
id = "venue-nexus-webhook-secret"
description = "Detected potential Payment Webhook signature verification secret"
regex = '''(?i)(payment|webhook)[_-]?(secret|signature)\s*[:=]\s*['"][0-9a-zA-Z_\-]{16,}['"]'''
secretGroup = 0
keywords = [
  "webhook_secret",
  "webhook-secret"
]

# Rule 3: AI Provider API Keys (TRD 15.7, CR-03)
[[rules]]
id = "venue-nexus-ai-credentials"
description = "Detected potential AI provider API key (OpenAI, Anthropic, Gemini, Mistral)"
regex = '''(?i)(ai[_-]?provider|openai|anthropic|gemini|mistral)[_-]?(key|secret|api[_-]?key)\s*[:=]\s*['"][0-9a-zA-Z_\-]{16,}['"]'''
secretGroup = 0
keywords = [
  "ai_provider",
  "openai",
  "anthropic",
  "gemini",
  "mistral"
]
