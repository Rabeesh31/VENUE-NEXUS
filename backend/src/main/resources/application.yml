spring:
  application:
    name: venue-nexus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:venuenexus_dev}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:venuenexus_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:replace_with_strong_db_password_in_env}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VenueNexusHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Actuator exposes only health, info, metrics, prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Security & Staff Identity
security:
  jwt:
    staff-secret: ${JWT_STAFF_SECRET:default-testing-secret-must-be-at-least-32-bytes-long!}
    issuer: venue-nexus
    audience: venue-nexus-staff
    access-ttl: PT15M
    leeway: PT0S
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXRlbXBvcmFyeS1kZXYtc2VjcmV0LWtleS1mb3ItdmVudWUtbmV4dXMtcGxhdGZvcm0=}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

  refresh:
    ttl: P7D

  login:
    max-failed-attempts: 5
    lockout-duration: PT15M

  password:
    bcrypt-strength: 12

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# QR Service Configuration

venuenexus:
  dev:
    bootstrap-enabled: ${DEV_BOOTSTRAP_ENABLED:false}
    admin-email: ${DEV_ADMIN_EMAIL:admin@localhost}
    admin-password: ${DEV_ADMIN_PASSWORD:}
  qr:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    path-prefix: ${QR_PATH_PREFIX:/q/}
