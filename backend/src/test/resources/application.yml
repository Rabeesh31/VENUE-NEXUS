spring:
  application:
    name: venue-nexus-phase3-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

security:
  jwt:
    staff-secret: test-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256!
    issuer: venue-nexus
    audience: venue-nexus-staff
    access-ttl: PT15M
    leeway: PT0S
  refresh:
    ttl: P7D
  login:
    max-failed-attempts: 5
    lockout-duration: PT15M
  password:
    bcrypt-strength: 10
  cors:
    allowed-origins: http://localhost:3000

