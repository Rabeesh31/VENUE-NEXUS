spring.application.name=venue-nexus-resource

# Server configuration
server.port=8080

# Jackson configuration (reject unknown fields as per TRD)
spring.jackson.deserialization.fail-on-unknown-properties=true

# In-memory H2 database (PostgreSQL mode) for local running
spring.datasource.url=jdbc:h2:mem:venuenexus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# QR Service configuration
PUBLIC_BASE_URL=http://localhost:8080
venuenexus.qr.path-prefix=/q/
